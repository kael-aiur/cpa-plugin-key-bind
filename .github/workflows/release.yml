name: release

# Build the web UI + cross-compile the c-shared plugin for linux/amd64 and
# linux/arm64, package each as <id>_<version>_<goos>_<goarch>.zip (the naming
# CPA's plugin store expects), generate checksums.txt, and publish a GitHub
# Release. Triggered by pushing a `v*` tag, or manually via workflow_dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v), e.g. 0.1.0'
        required: true

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  build:
    name: build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: ''
            apt: ''
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web UI (single-file)
        run: |
          cd web
          npm ci || npm install
          VITE_HOSTED=1 npm run build
          cp dist/index.html ../internal/plugin/web/dist/index.html

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install C cross-compiler (${{ matrix.arch }})
        if: ${{ matrix.apt != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build plugin (c-shared)
        env:
          CC: ${{ matrix.cc }}
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -buildvcs=false -tags cshared -buildmode=c-shared -o key-bind.so ./cmd/key-bind

      - name: Package zip
        run: zip -j key-bind_${{ steps.ver.outputs.version }}_linux_${{ matrix.arch }}.zip key-bind.so

      - uses: actions/upload-artifact@v4
        with:
          name: key-bind_linux_${{ matrix.arch }}
          path: key-bind_*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum *.zip > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
          draft: false
