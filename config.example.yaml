# CLIProxyAPI plugin configuration for key-bind.
# Merge this under the top-level `plugins:` key in your CLIProxyAPI config.yaml.

plugins:
  enabled: true
  dir: "plugins"                              # directory holding the compiled key-bind.so/.dylib
  configs:
    key-bind:
      enabled: true
      bindings: []                             # 由 key-bind 配置页管理，并持久化在宿主 config.yaml 文件中
